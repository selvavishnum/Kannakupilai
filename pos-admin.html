   scope   : the shop this page is managing, or '' for all shops
   locked  : true when the subdomain fixed the scope */
let ME=null, DEMO_ADMIN=false, CATS={};      // CATS: shopId -> catalog document

const RESERVED_SUB=['www','arthanote','app','api','admin','staging','dev','test','preview','pos'];
function shopSlugFromHost(){
  const h=(location.hostname||'').toLowerCase();
  if(!h||h==='localhost'||/^\d{1,3}(\.\d{1,3}){3}$/.test(h)||h.endsWith('.vercel.app')) return '';
  const parts=h.split('.');
  if(parts.length<3) return '';
  const first=parts[0];
  if(RESERVED_SUB.includes(first)) return '';
  return /^[a-z0-9-]{1,40}$/.test(first)?first:'';
}
const SHOP_SLUG=shopSlugFromHost();
const slugify=x=>String(x||'').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
function matchShopBySlug(shops,slug){
  if(!slug) return '';
  const ent=Object.entries(shops||{});
  for(const [id,sh] of ent) if(slugify(sh&&sh.slug)===slug) return id;
  for(const [id] of ent) if(slugify(id)===slug) return id;
  for(const [id,sh] of ent) if(slugify(sh&&sh.name)===slug) return id;
  // "thuckalay" matching "Thuckalay Vegetables" — the shop's leading word
  for(const [id,sh] of ent) if(slugify(sh&&sh.name).startsWith(slug+'-')) return id;
  return '';
}
const shopName=id=>(ME&&ME.shops[id]&&ME.shops[id].name)||id;
const catalogId=sid=>ME.businessId+'__'+sid;
const catKey=x=>String(x||'').replace(/[.$\[\]#\/]/g,'_').slice(0,60);
/* Shops this page may act on: one when the subdomain fixed it, all otherwise */
const inScope=()=>ME?(ME.scope?[ME.scope]:Object.keys(ME.shops)):[];

function signInAdmin(){
  const err=document.getElementById('lock-err'), btn=document.getElementById('lock-btn');
  const email=(document.getElementById('lock-email').value||'').trim();
  const pass=document.getElementById('lock-pass').value;
  err.style.display='none';
  if(!email||!pass){ err.textContent='Enter your email and password.'; err.style.display='block'; return; }
  if(!FB_OK){ err.textContent='Cannot reach Firebase from this device. Explore the demo, or check the connection.'; err.style.display='block'; return; }
  btn.disabled=true; btn.textContent='Signing in…';
  AUTH.signInWithEmailAndPassword(email,pass)
    .then(cred=>resolveMe(cred.user))
    .then(()=>{ document.getElementById('lock').style.display='none'; bootAdmin(); })
    .catch(e=>{
      const m=({'auth/wrong-password':'Wrong password.','auth/user-not-found':'No account with that email.',
        'auth/invalid-email':'That email address is not valid.','auth/too-many-requests':'Too many attempts — wait a minute.',
        'auth/network-request-failed':'No connection. Try again when you are online.'})[e.code]
        ||('Sign-in failed: '+(e.message||e.code));
      err.textContent=m; err.style.display='block';
    })
    .finally(()=>{ btn.disabled=false; btn.textContent='Sign in'; });
}
function resolveMe(user){
  return FS.collection('staff').doc(user.uid).get()
    .catch(()=>({exists:false}))
    .then(d=>{ const st=d.exists?d.data():{};
      return {uid:user.uid,businessId:st.businessId||user.uid,email:user.email||'',
              name:st.name||user.displayName||user.email||'Manager',role:st.role||'owner'}; })
    .then(me=>FS.collection('config').doc(me.businessId).get()
      .then(c=>{ me.shops=(c.exists&&c.data().shops)||{}; return me; })
      .catch(()=>{ me.shops={}; return me; }))
    .then(me=>{
      if(!Object.keys(me.shops).length) me.shops={s1:{name:'Main shop'}};
      const bound=matchShopBySlug(me.shops,SHOP_SLUG);
      me.scope=bound||''; me.locked=!!bound;
      ME=me; DEMO_ADMIN=false;
      const wiped=clearDemoData();
      if(wiped) setTimeout(()=>toast('Demo data cleared — this is your real shop now'),700);
      return loadCatalogs().then(loadLiveRollups);
    });
}
function startAdminDemo(){
  DEMO_ADMIN=true;
  DB=seedDB(); DB._demo=true; save();     // sample rows exist ONLY here
  ROLL={}; try{ localStorage.removeItem(LS_ROLL); }catch(e){}
  loadRollups();
  /* The demo gets a one-shop identity so Product Inventory is explorable
     rather than a locked door — it runs the SAME code as a real shop, on a
     catalog built from the sample rows. DEMO_ADMIN still gates everything
     that would touch Firestore: nothing here is saved or sent. */
  ME={uid:'demo',businessId:'demo',email:'',name:'Demo manager',role:'owner',
      shops:{demo:{name:'Demo shop'}},scope:'demo',locked:true};
  CATS={demo:{businessId:'demo',shopId:'demo',settings:{gstOn:DB.settings.gstOn,gstRate:DB.settings.gstRate},items:{}}};
  DB.products.forEach(p=>{ CATS.demo.items[p.sku]={nameEn:p.nameEn,nameTa:p.nameTa,category:p.category,
    unit:p.unit,cost:p.cost,price:p.price,mrp:0,gst:0,stock:p.stock,barcode:p.barcode||'',hsn:'',active:true}; });
  priceShop='demo'; priceQ=''; priceCat='';
  document.getElementById('lock').style.display='none';
  bootAdmin();
  toast('Demo data — nothing here is your real shop');
}
/* A real account must never see a sample row. If the book on this device
   was the demo one, it is replaced outright rather than merged — a merge
   would leave six invented employees sitting under the shop's real ones. */
function clearDemoData(){
  if(!DB._demo) return false;
  DB=emptyDB(); save();
  ROLL={}; try{ localStorage.removeItem(LS_ROLL); }catch(e){}
  return true;
}
/* The Dashboard and the 15 reports read ROLL. On a real account it is
   filled from pos_rollups — one document per shop per day — so those
   screens show the shop's own takings instead of nothing at all.
   Days are merged across shops, because the Dashboard is a whole-business
   view; the Nightly check is where the per-shop split lives. */
function loadLiveRollups(){
  if(DEMO_ADMIN||!ME||!FB_OK) return Promise.resolve();
  return fetchRollups(90).then(rows=>{
    ROLL={};
    rows.forEach(r=>{
      const d=r.date; if(!d) return;
      const e=ROLL[d]=ROLL[d]||{date:d,bills:0,sales:0,cash:0,upi:0,card:0,items:{},synth:false};
      e.bills+=r.bills||0; e.sales+=r.sales||0;
      e.cash+=r.cash||0; e.upi+=r.upi||0; e.card+=r.card||0;
      Object.entries(r.items||{}).forEach(([k,v])=>{
        const i=e.items[k]=e.items[k]||{name:v.name||k,qty:0,amt:0};
        i.qty+=v.qty||0; i.amt+=v.sales||0; if(v.name) i.name=v.name;
      });
    });
    Object.values(ROLL).forEach(e=>['sales','cash','upi','card'].forEach(k=>e[k]=+e[k].toFixed(2)));
    saveRollups();
  }).catch(e=>{ console.warn('could not read rollups:',e&&e.message); });
}
function signOutAdmin(){
  if(FB_OK&&AUTH.currentUser) AUTH.signOut().catch(()=>{});
  location.reload();
}

/* ── catalogs: one document per shop, read once on sign-in ── */
function loadCatalogs(){
  CATS={};
  const ids=inScope();
  if(!ids.length) return Promise.resolve();
  return Promise.all(ids.map(sid=>
    FS.collection('shop_catalog').doc(catalogId(sid)).get()
      .then(d=>{ CATS[sid]=d.exists?d.data():{businessId:ME.businessId,shopId:sid,items:{},settings:{}}; })
      .catch(()=>{ CATS[sid]={businessId:ME.businessId,shopId:sid,items:{},settings:{}}; })
  )).then(()=>{});
}
/* A full rewrite of one shop's catalog. Deliberately NOT merge:true — an
   item deleted here must actually disappear, and a merge would leave it
   behind on every till forever.

   THE STOCK TRAP. The tills have been writing stock increments the whole
   time this screen was open, so the counts read at sign-in are already
   stale, and a blind rewrite would silently undo every sale made since.
   So: re-read the document at save time and keep the server's count for
   every item whose stock was NOT deliberately typed over here. Only a
   physical recount overwrites what the tills counted.                       */
const _stockEdited={};                     // shopId -> {sku:true}
function saveCatalog(sid){
  // Demo edits stay in the tab. Saying so beats a red error the moment
  // someone tries the button.
  if(DEMO_ADMIN) return Promise.reject(new Error('demo data — nothing is saved or sent to any till'));
  if(!ME||!FB_OK) return Promise.reject(new Error('Firebase is not reachable from this device'));
  const ref=FS.collection('shop_catalog').doc(catalogId(sid));
  return ref.get().then(d=>{
    const live=(d.exists&&d.data().items)||{};
    const edited=_stockEdited[sid]||{};
    const c=JSON.parse(JSON.stringify(CATS[sid]));   // sentinels must not leak into CATS
    Object.entries(c.items||{}).forEach(([sku,it])=>{
      if(!edited[sku]&&live[sku]&&typeof live[sku].stock==='number') it.stock=live[sku].stock;
    });
    c.businessId=ME.businessId; c.shopId=sid; c.shopName=shopName(sid);
    c.updatedAt=firebase.firestore.FieldValue.serverTimestamp();
    return ref.set(c).then(()=>{
      CATS[sid].items=c.items;              // screen now shows what the server holds
      _stockEdited[sid]={};
    });
  });
}

/* ── rollups: the nightly check ──
   One read per shop per day. `days` back from today, for every shop in
   scope. 6 shops x 90 days = 540 reads for a full quarter — about ₹0.03. */
function fetchRollups(days){
  if(DEMO_ADMIN||!ME||!FB_OK) return Promise.resolve([]);
  const ids=inScope(), keys=[];
  for(let i=0;i<days;i++){
    const dt=new Date(); dt.setDate(dt.getDate()-i); const d=iso(dt);
    ids.forEach(sid=>keys.push([sid,d,ME.businessId+'_'+sid+'_'+d]));
  }
  // documentId() 'in' queries take 30 at a time; this is one query per 30
  // documents instead of one round trip per document.
  const chunks=[];
  for(let i=0;i<keys.length;i+=30) chunks.push(keys.slice(i,i+30));
  return Promise.all(chunks.map(ch=>
    FS.collection('pos_rollups')
      .where(firebase.firestore.FieldPath.documentId(),'in',ch.map(k=>k[2]))
      .get().then(sn=>sn.docs.map(d=>d.data())).catch(()=>[])
  )).then(res=>[].concat.apply([],res));
}

/* ═════════ init ═════════ */
/* ─── manager lock ────────────────────────────────────────────────────
   Held in sessionStorage, not localStorage: closing the browser re-locks
   the back office. On a shared counter machine that matters — an unlock
   that survives until someone clears site data is not a lock. */
function lockAdmin(){ signOutAdmin(); }

function bootAdmin(){
  renderNav();
  // The till deep-links here (#prod-price) rather than telling the manager to
  // go and find the screen themselves.
  const h=(location.hash||'').replace(/^#/,'');
  go(SPECIAL[h]||SCHEMA[h]||h.startsWith('ord-')?h:'dashboard');
  icons();
  updateSrcPill();
}
function updateSrcPill(){
  const el=document.getElementById('src-pill'); if(!el) return;
  if(DEMO_ADMIN||!ME){ el.textContent='demo data'; el.className='pill'; return; }
  el.textContent=ME.locked?shopName(ME.scope):Object.keys(ME.shops).length+' shops';
  el.className='pill ok';
}

/* ─── init ───────────────────────────────────────────────────────── */
load();
document.getElementById('today').textContent=new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
icons();
if(SHOP_SLUG) document.getElementById('lock-sub').textContent='Back office for '+SHOP_SLUG;
/* A signed-in session is restored rather than re-typed. onAuthStateChanged
   also fires with null on first load when nobody is signed in, which is what
   leaves the sign-in card up. */
if(FB_OK){
  AUTH.onAuthStateChanged(u=>{
    if(!u||ME||DEMO_ADMIN) { if(!u&&!DEMO_ADMIN) document.getElementById('lock-email').focus(); return; }
    resolveMe(u).then(()=>{ document.getElementById('lock').style.display='none'; bootAdmin(); })
      .catch(e=>console.warn('could not restore session:',e&&e.message));
  });
}else{
  document.getElementById('lock-err').textContent='Firebase did not load — only the demo is available on this device.';
  document.getElementById('lock-err').style.display='block';
}
addEventListener('resize',()=>{
  // The price list swaps between a table and cards at 760px, so it has to
  // redraw on a rotation the same way the charts do.
  if(page==='dashboard'||page==='reports'||page==='prod-inv'||page==='prod-price') go(page);
});
</script>
